# web3-auth-svc configuration
#
# Copy this file to /etc/web3-auth/config.toml and customize

# ============================================================
# HTTPS Server Configuration (required)
# Serves the signing page and handles signature callbacks
# ============================================================
[https]
# HTTPS port
port = 8443

# Bind addresses (dual-stack IPv6+IPv4)
bind = ["::", "0.0.0.0"]

# TLS certificate and key paths
cert_path = "/etc/libpam-web3/tls/cert.pem"
key_path = "/etc/libpam-web3/tls/key.pem"

# Path to signing page HTML file
signing_page_path = "/usr/share/libpam-web3/signing-page/index.html"
