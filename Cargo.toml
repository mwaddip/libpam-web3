[package]
name = "pam_web3"
version = "0.3.0"
edition = "2021"
description = "PAM module for Ethereum wallet-based authentication"
license = "MIT"
repository = "https://github.com/mwaddip/libpam-web3"
keywords = ["pam", "authentication", "ethereum", "web3", "wallet", "nft"]
categories = ["authentication"]

[lib]
name = "pam_web3"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pam_web3_tool"
path = "src/bin/pam_web3_tool.rs"

[dependencies]
# PAM bindings
pam = { version = "0.8", features = ["module"] }

# Ethereum primitives and signature recovery
alloy-primitives = "0.8"
k256 = { version = "0.13", features = ["ecdsa", "ecdh"] }

# Hashing
sha3 = "0.10"

# Crypto / randomness
rand = "0.8"
hex = "0.4"

# System
libc = "0.2"

# Error handling
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Encryption (ecies, AES-GCM, x25519)
ecies = "0.2"
aes-gcm = "0.10"
crypto_box = "0.9"
base64 = "0.22"
hkdf = "0.12"
sha2 = "0.10"

# CLI
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
