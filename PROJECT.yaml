# libpam-web3 Project Documentation
# Machine-readable project specification for integration and automation
# Version: 0.8.0

project:
  name: libpam-web3
  description: PAM module for Linux authentication via wallet signatures
  version: "0.8.0"
  license: MIT
  repository: https://github.com/mwaddip/libpam-web3
  language: Rust
  edition: "2021"

overview:
  summary: |
    A PAM (Pluggable Authentication Module) that authenticates Linux users
    by verifying wallet signatures and mapping wallet addresses to usernames
    via GECOS fields in /etc/passwd.

  authentication_flow:
    - User connects via SSH, sees OTP code and signing URL
    - If /run/libpam-web3/pending/ exists, URL includes ?session= param and session file is created
    - User signs message with wallet (EVM or OPNet)
    - "Signature delivery: callback mode (auto when auth service running) or manual paste"
    - "Content-based detection: raw hex → EVM ecrecover, JSON → OPNet OTP validation"
    - GECOS lookup for wallet=ADDRESS in /etc/passwd
    - User logged in as mapped Linux username

  signature_types:
    evm:
      description: secp256k1 ecrecover from raw hex signature
      format: "0x + 130 hex chars (65-byte signature)"
      verification: Cryptographic recovery of wallet address from signature

    opnet:
      description: JSON callback with OTP validation and wallet address
      format: '{"otp":"123456","machine_id":"server","wallet_address":"0x..."}'
      verification: OTP validation (HMAC + expiry), then trust wallet_address

architecture:
  components:
    pam_module:
      binary: libpam_web3.so
      install_path: /lib/x86_64-linux-gnu/security/
      source: src/lib.rs
      description: Core PAM module, loaded by sshd/login

    pam_web3_tool:
      binary: pam_web3_tool
      install_path: /usr/bin/
      source: src/bin/pam_web3_tool.rs
      description: CLI for keypair generation and encryption

  source_modules:
    lib.rs: PAM entry point, signature detection, authentication orchestration
    callback.rs: Callback-based signing session management (file IPC with auth service)
    config.rs: TOML configuration loading and validation
    otp.rs: OTP generation (HMAC-SHA3 with machine_id + timestamp)
    signature.rs: secp256k1 ecrecover for wallet address recovery
    passwd_lookup.rs: GECOS-based wallet address to username lookup (wallet=ADDRESS)
    ecies.rs: ECIES encryption (secp256k1, x25519, AES-GCM)

build:
  commands:
    default:
      command: cargo build --release
      outputs:
        - target/release/libpam_web3.so
        - target/release/pam_web3_tool

    deb_package_pam:
      command: ./packaging/build-deb.sh
      output: packaging/libpam-web3_0.8.0_amd64.deb
      description: PAM module for VMs (authentication)

    deb_package_tools:
      command: ./packaging/build-deb-tools.sh
      output: packaging/libpam-web3-tools_0.8.0_amd64.deb
      description: Server-side tools (key generation, encryption)

    tests:
      command: cargo test

configuration:
  main_config:
    path: /etc/pam_web3/config.toml
    format: TOML

  sections:
    machine:
      required: true
      fields:
        id:
          type: string
          required: true
          description: Unique machine identifier (used in OTP and signing message)
          example: "my-server-hostname"
        secret_key:
          type: string (hex)
          required: true
          description: HMAC key for OTP generation (32 bytes hex, 0x prefix optional)
          example: "0x0123456789abcdef..."

    auth:
      required: true
      fields:
        signing_url:
          type: url
          required: true
          description: URL displayed to user for wallet signing
          example: "https://auth.example.com"
        otp_length:
          type: integer
          default: 6
          description: Length of OTP code
        otp_ttl_seconds:
          type: integer
          default: 300
          description: OTP validity period in seconds
files:
  configuration:
    - path: /etc/pam_web3/config.toml
      description: Main PAM module configuration
      permissions: "640"
    - path: /etc/libpam-web3/tls/cert.pem
      description: Self-signed TLS certificate (shared with auth service)
      permissions: "644"
    - path: /etc/libpam-web3/tls/key.pem
      description: TLS private key
      permissions: "600"
    - path: /run/libpam-web3/pending/
      description: Session files for callback-based signing (created by auth service)
      permissions: "700"

  binaries:
    - path: /lib/x86_64-linux-gnu/security/libpam_web3.so
      description: PAM module
    - path: /usr/bin/pam_web3_tool
      description: Key generation CLI (in libpam-web3-tools package)

integration:
  pam_configuration:
    file: /etc/pam.d/sshd
    example: |
      # Add before @include common-auth:
      auth [success=2 default=ignore] pam_succeed_if.so user != web3user1 user != web3user2
      auth [success=1 default=die] pam_web3.so
      @include common-auth
    description: |
      The pam_succeed_if line lists users that should use web3 auth.
      Other users fall through to standard auth.

  ssh_configuration:
    file: /etc/ssh/sshd_config
    required_settings:
      KbdInteractiveAuthentication: "yes"
      UsePAM: "yes"

  user_setup:
    gecos_format:
      description: Wallet address mapped to Linux username via GECOS field
      format: "wallet=ADDRESS[,nft=TOKEN_ID]"
      command_example: |
        useradd -m -c "wallet=0x1234...abcd,nft=0" johndoe
        # Or update existing:
        usermod -c "wallet=0x1234...abcd,nft=0" johndoe

cli_tools:
  pam_web3_tool:
    commands:
      generate-keypair:
        description: Generate secp256k1 ECIES keypair
        usage: pam_web3_tool generate-keypair --output server.key --show-pubkey
        output: Writes private key to file, prints public key to stdout

      encrypt-symmetric:
        description: Encrypt data with signature-derived AES-256-GCM key
        usage: pam_web3_tool encrypt-symmetric --signature "0x..." --plaintext '{"hostname":"..."}'
        output: Hex-encoded ciphertext for userEncrypted field

      decrypt-symmetric:
        description: Decrypt data with signature-derived key
        usage: pam_web3_tool decrypt-symmetric --signature "0x..." --ciphertext "..."
        output: Decrypted plaintext

      decrypt:
        description: Decrypt ECIES-encrypted data (for transport decryption)
        usage: pam_web3_tool decrypt --scheme secp256k1 --private-key-file server.key --ciphertext "..."
        output: Decrypted plaintext

smart_contract:
  path: contracts/src/AccessCredentialNFT.sol
  type: ERC-721
  version: "0.4.0"
  deployment:
    tool: Foundry (forge)
    command: |
      forge create src/AccessCredentialNFT.sol:AccessCredentialNFT \
        --rpc-url $RPC_URL --private-key $DEPLOYER_KEY \
        --constructor-args "Access Credentials" "ACCESS" "$IMAGE_URI"

security:
  considerations:
    - Store private keys (server.key, deployer.key) securely, never commit to git
    - OTP TTL should balance usability and security (default 300s)
    - Consider using private RPC endpoints in production
    - OPNet path trusts wallet_address from JSON only after OTP validation

  revocation:
    method: Remove wallet=ADDRESS from GECOS or delete user

troubleshooting:
  logs:
    pam_module: /var/log/auth.log (grep pam_web3)

  common_issues:
    signature_recovery_failed:
      cause: Wrong message format or corrupted signature
      check: Verify signing page uses correct message format

    wallet_not_found:
      cause: Wallet address not in any GECOS field
      check: Verify user has wallet=ADDRESS in GECOS (grep wallet /etc/passwd)

dependencies:
  runtime:
    required:
      - libc6 (>= 2.31)
      - libpam-runtime

  build:
    - Rust toolchain (rustc, cargo)
    - OpenSSL development headers
    - Foundry (for contract deployment)

changelog:
  - version: "0.8.0"
    date: "2026-02-17"
    breaking_changes:
      - component: packaging
        change: |
          Extracted web3-auth-svc and signing-page from libpam-web3.
          Auth service now ships with the engine template package.
          libpam-web3 .deb only contains the PAM module.
      - component: pam_module
        change: |
          Removed callback_enabled and callback_grace_seconds from config.
          Callback mode is now detected at runtime: if /run/libpam-web3/pending/
          exists (created by a running auth service), callbacks are enabled.
    removed:
      - web3-auth-svc/ (entire directory, moved to engine)
      - signing-page/ (moved to engine)
      - callback_enabled config field
      - callback_grace_seconds config field
      - web3-auth-svc binary from libpam-web3 .deb
      - signing-page from libpam-web3-tools .deb
      - systemd unit for web3-auth-svc from .deb
    config_changes:
      - "PAM: removed auth.callback_enabled (now runtime-detected)"
      - "PAM: removed auth.callback_grace_seconds (now constant 10s)"
    version_bumps:
      deb_packages: "0.7.0 -> 0.8.0"

  - version: "0.7.0"
    date: "2026-02-17"
    breaking_changes:
      - component: pam_module
        change: |
          Removed wallet mode (flat-file lookup) and NFT mode (blockchain query + GECOS/LDAP).
          Replaced with unified GECOS wallet address lookup.
          GECOS format changed from nft=TOKEN_ID to wallet=ADDRESS[,nft=TOKEN_ID].
      - component: pam_module
        change: |
          Removed [wallet], [blockchain], [ldap] config sections.
          Removed auth.mode and auth.nft_lookup config fields.
          Config now only requires [machine] and [auth] sections.
      - component: pam_module
        change: |
          Removed nft feature flag. All dependencies are now unconditional.
          Build with: cargo build --release (no --features nft needed).
      - component: web3_auth_svc
        change: |
          Removed Unix socket server and blockchain query backends.
          web3-auth-svc is now purely an HTTPS server for signing page and callbacks.
          Config requires [https] section (no longer optional).
    new_features:
      - "Multi-chain support: content-based signature detection (EVM raw hex vs OPNet JSON)"
      - "OPNet callback path: JSON with OTP + machine_id + wallet_address"
      - "Unified GECOS lookup: wallet=ADDRESS for all chains"
    removed:
      - src/blockchain.rs (Unix socket client)
      - src/wallet_auth.rs (flat-file lookup)
      - src/ldap.rs (LDAP client)
      - web3-auth-svc/src/backends/ (blockchain query backends)
      - web3-auth-svc/src/protocol/ (socket protocol)
      - tokio and ldap3 dependencies from PAM module
      - async-trait, reqwest, ecies, sha3, base64 from web3-auth-svc
    config_changes:
      - "PAM: removed [wallet], [blockchain], [ldap] sections"
      - "PAM: removed auth.mode, auth.nft_lookup fields"
      - "web3-auth-svc: removed socket_path, backend, default_chain_id, default_contract"
      - "web3-auth-svc: removed [jsonrpc], [etherscan] sections"
      - "web3-auth-svc: [https] is now required (was optional)"
    version_bumps:
      deb_packages: "0.6.0 -> 0.7.0"

  - version: "0.6.0"
    date: "2026-02-14"
    new_features:
      - "Callback-based signing: browser auto-fills OTP/machine and POSTs signature via HTTPS"
      - "Session file IPC between PAM module and web3-auth-svc (/run/libpam-web3/pending/)"
      - "HTTPS server in web3-auth-svc (axum + rustls) with GET /, GET /auth/pending/:id, POST /auth/callback/:id"
      - "Self-signed TLS certificate auto-generation in postinst"
      - "New config fields: callback_enabled, callback_grace_seconds in [auth]"
      - "New optional [https] section in web3-auth-svc config"
    config_changes:
      - "[auth] section: added callback_enabled (default true), callback_grace_seconds (default 10)"
      - "web3-auth-svc: added optional [https] section (listen, cert_path, key_path, signing_page_path)"
    dependency_changes:
      - "serde_json moved from nft-optional to always-on (needed for callback session files)"
      - "web3-auth-svc: added axum, axum-server (tls-rustls), rustls, rustls-pemfile"
    version_bumps:
      pam_web3: "0.2.0 -> 0.3.0"
      web3_auth_svc: "0.1.0 -> 0.2.0"
      deb_packages: "0.5.0 -> 0.6.0"

  - version: "0.5.0"
    date: "2026-01-31"
    breaking_changes:
      - component: smart_contract
        change: |
          Removed contract-wide signing page from constructor and storage.
          Each NFT must now provide its own animationUrlBase64 (no fallback).
      - component: signing_page
        change: |
          Removed generate.sh and decrypt tab from signing page.
          Signing page is now served from the local filesystem by VMs.
    new_features:
      - AccessCredentialNFT.sol and ABI included in libpam-web3-tools package

  - version: "0.4.0"
    date: "2026-01-31"
    breaking_changes:
      - component: smart_contract
        change: |
          Removed serverEncrypted parameter from mint().
          Authentication is now purely ownership-based (no server-side decryption).
      - component: pam_module
        change: |
          Removed private_key_file from [machine] config section.
          NFT authentication no longer requires server private key.
      - component: packaging
        change: |
          Split into two packages:
          - libpam-web3: PAM module for VMs (authentication)
          - libpam-web3-tools: Server tools (pam_web3_tool, signing page)
    new_features:
      - Simplified ownership-based authentication (wallet + NFT token ID + GECOS)
